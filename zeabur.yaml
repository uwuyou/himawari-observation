# yaml-language-server: $schema=https://schema.zeabur.app/template.json
# Zeabur Template —— Himawari-9 实时云数据处理 + 静态站（纯 Zeabur 方案）
#
# 用途：在 Zeabur 控制台用「从 YAML 创建模板 / 导入」时使用。
# 构建识别由仓库根目录 zbpack.json 负责：
#   zbpack.json = { "dockerfile": { "path": "zeabur/Dockerfile" } }
# 它会让 Zeabur 用 zeabur/Dockerfile 以 Docker 方式构建。
#
# 部署要点：
#   1. 给服务挂一个「存储卷」到 /data（重要！图片/预测写在卷里，重建容器不丢）。
#   2. 在服务「环境变量」里可设（均可选）：
#        SCHED_MINUTES  刷新周期（分钟，默认 30）
#        CITY_NAME / CITY_LAT / CITY_LON  火烧云预测城市（默认 上海 31.23 121.47）
#   3. 无 GITHUB_TOKEN —— 已彻底去掉 GitHub 依赖。
#   4. 绑定域名后即可访问；服务自带自动刷新，无需额外定时器。

apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: himawari-site
spec:
  description: |
    一体化常驻服务：作为网页前端提供服务，并内置 APScheduler 每 30 分钟
    从 NOAA AWS S3 拉取 Himawari-9 数据，生成红外云图 / 云分类图 /
    夜间微物理合成图 / 火烧云预测。无需 GitHub，无需 Vercel。
  icon: https://raw.githubusercontent.com/zeabur/service-icons/main/marketplace/docker.svg
  services:
    - name: himawari-site
      icon: https://raw.githubusercontent.com/zeabur/service-icons/main/marketplace/docker.svg
      template: PREBUILT_V2
      spec:
        ports:
          - id: web
            port: 8080
            type: HTTP
        env:
          SCHED_MINUTES:
            default: "30"
          CITY_NAME:
            default: 上海
          CITY_LAT:
            default: "31.23"
          CITY_LON:
            default: "121.47"