name: Update Himawari Cloud Images

# 每小时的固定时间运行；也支持手动触发和 push 触发。
# NOAA 每 10 分钟生成一个时次，上传到 AWS S3 约滞后 1-3 小时。
# 每 15 分钟触发一次，能在新数据到达后 ~7 分钟内捕捉到并更新网站。
on:
  schedule:
    - cron: '0,15,30,45 * * * *'   # UTC 每 15 分钟一次
  workflow_dispatch:            # 允许在 Actions 页手动点 Run
  push:
    branches: [main]
    paths: ['scripts/**']

permissions:
  contents: write               # 允许工作流把更新后的图推回仓库

concurrency:
  group: himawari-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet satpy cartopy xarray matplotlib scipy requests

      - name: Install CJK fonts for Chinese labels on cloud maps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          rm -rf ~/.cache/matplotlib

      - name: Generate latest IR image (and detect obs time)
        id: gen
        working-directory: scripts
        shell: bash
        run: |
          set +e
          # --max-back-hours 12 确保即使遇到长时间网络延迟也能找到最新数据
          LOG=$(python himawari_s3_cloud_map.py --latest --composite B13 --out ../assets/ir_latest.png --max-back-hours 12 2>&1)
          RC=$?
          set -e
          echo "exit_code=$RC"
          echo "$LOG"
          TIME_UTC=$(echo "$LOG" | grep -oE '[0-9]{12}' | head -1)
          if [ -z "$TIME_UTC" ]; then
            echo "utc=" >> "$GITHUB_OUTPUT"
            echo "[WARN] IR 未探测到时次，跳过本轮更新"
          else
            echo "utc=$TIME_UTC" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate latest cloud-type image
        working-directory: scripts
        run: |
          T="${{ steps.gen.outputs.utc }}"
          if [ -n "$T" ]; then
            echo "云分类基于 IR 时次: $T"
            python himawari_cloud_type.py --time "$T" --out ../assets/cloudtype_latest.png
          else
            echo "IR 时次为空，用 --latest 单独探测"
            python himawari_cloud_type.py --latest --max-back-hours 12 --out ../assets/cloudtype_latest.png
          fi

      - name: Generate latest Night Microphysics image
        working-directory: scripts
        run: |
          T="${{ steps.gen.outputs.utc }}"
          if [ -n "$T" ]; then
            echo "Night Microphysics 基于 IR 时次: $T"
            python himawari_s3_cloud_map.py --time "$T" --composite night_microphysics --out ../assets/night_microphysics_latest.png
          else
            echo "IR 时次为空，用 --latest 单独探测"
            python himawari_s3_cloud_map.py --latest --max-back-hours 12 --composite night_microphysics --out ../assets/night_microphysics_latest.png
          fi

      - name: Generate latest fire cloud prediction (Shanghai)
        working-directory: scripts
        run: |
          T="${{ steps.gen.outputs.utc }}"
          if [ -n "$T" ]; then
            echo "火烧云预测基于 IR 时次: $T"
            python fire_cloud_predict.py --lat 31.23 --lon 121.47 --name 上海 --time "$T" --json ../assets/fire_prediction.json --export-cloud-json ../assets/cloud_data.json
          else
            echo "IR 时次为空，用 --latest 单独探测"
            python fire_cloud_predict.py --lat 31.23 --lon 121.47 --name 上海 --latest --max-back-hours 12 --json ../assets/fire_prediction.json --export-cloud-json ../assets/cloud_data.json
          fi
          echo "火烧云预测完成，云数据已导出"

      - name: Update observation timestamp in index.html
        run: |
          T="${{ steps.gen.outputs.utc }}"
          if [ -n "$T" ]; then
            sed -i -E "s/const utc = \"[0-9]{12}\";/const utc = \"$T\";/" index.html
          fi

      - name: Commit and push
        run: |
          git config user.name "himawari-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无内容变更，跳过推送"
            exit 0
          fi
          git commit -m "auto update Himawari ${UTC_NOW:-$(date -u +%Y%m%d%H%M)}"
          # 拉取并发产生的新提交后再推，避免非快进被拒
          git pull --rebase origin main 2>/dev/null || true
          if git push 2>&1; then
            echo "已推送最新云图"
          else
            git push --force-with-lease origin main 2>&1 | tail -3
          fi